- { term: "bina", he: "בינה", gloss: "understanding; going down into a concept and analyzing it", segment: 1 }
- { term: "tevuna", he: "תבונה", gloss: "the light of bina spreading forth: bringing a concept out to others, into application and into the emotions", segment: 1 }
- { term: "kelita", he: "קליטה", gloss: "absorbing a concept like a sponge, so it becomes part of oneself; it comes from going over it again after it is understood", segment: 2 }
- { term: "hisbonenus", he: "התבוננות", gloss: "contemplation; going over a matter again and again", segment: 2 }
- { term: "ish tevuna", he: "איש תבונה", gloss: "a man of tevuna; one who can draw the deep waters up to others", segment: 2 }
- { term: "omek hamusag", he: "עומק המושג", gloss: "the depth of the concept, hidden in the concept itself", segment: 4 }
- { term: "tafsan", he: "תפסן", gloss: "a grasper; one strong in bina whose understanding stays where it is", segment: 7 }
- { term: "hiyuli", he: "היולי", gloss: "raw potential; an idea of which nobody yet knows what will come", segment: 13 }
- { term: "Yisroel Saba", he: "ישראל סבא", gloss: "the emotions of chachma as they come out; paired with Tevuna as the lower father and mother", segment: 20 }
- { term: "ben u'vas", he: "בן ובת", gloss: "lit. son and daughter (the letters of tevuna); chesed and gevura of daas, born of tevuna", segment: 21 }
- { term: "Ima tata'a", he: "אמא תתאה", gloss: "the lower mother; tevuna, which gives birth to the emotions", segment: 26 }
- { term: "bina sheb'bina", he: "בינה שבבינה", gloss: "bina within bina; hisbonenus, which brings kelita and so joins bina to tevuna", segment: 34 }
