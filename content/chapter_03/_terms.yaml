- { term: "bina", he: "בינה", gloss: "the essential grasp of a G-dly concept in all its particulars", segment: 1 }
- { term: "tevuna", he: "תבונה", gloss: "drawing the hidden depth of a concept down into revelation and into separate matters", segment: 1 }
- { term: "memalei kol almin", he: "ממלא כל עלמין", gloss: "(the light) that fills all worlds; the coming into being of something from nothing", segment: 2 }
- { term: "omek hamusag", he: "עומק המושג", gloss: "the depth of the concept, how it is in its essence", segment: 3 }
- { term: "iyun", he: "עיון", gloss: "close analysis; the vessel that leads to the depth", segment: 4 }
- { term: "orech", he: "אורך", gloss: "length; bringing the concept close to the mind through physical analogies", segment: 4 }
- { term: "rochav", he: "רוחב", gloss: "breadth; explaining the same concept in many different ways", segment: 6 }
- { term: "hispashtus min ha'etzem", he: "התפשטות מן העצם", gloss: "spreading forth from the essence, as the soul's life in the body", segment: 7 }
- { term: "gilui ha'helem", he: "גילוי ההעלם", gloss: "revelation of what is hidden, as speech reveals thought", segment: 8 }
- { term: "daas", he: "דעת", gloss: "recognition and feeling; connection to the concept", segment: 14 }
- { term: "re'iyas hasechel", he: "ראיית השכל", gloss: "sight of the intellect; seeing the truth of a matter, beyond following its explanation", segment: 17 }
- { term: "ein od milvado", he: "אין עוד מלבדו", gloss: "there is nothing besides Him", segment: 19 }
