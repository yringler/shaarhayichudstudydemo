- { term: "Mekora d'Kula", he: "מקורא דכולא", gloss: "the Source of everything; the Essence of the Or Ein Sof before the tzimtzum", segment: 6 }
- { term: "Yachid", he: "יחיד", gloss: "lit. singular; the first level of the Essence, where even 'unity' does not apply", segment: 11 }
- { term: "Echad", he: "אחד", gloss: "lit. one; the second level, where powers ready to come out are unified", segment: 11 }
- { term: "Kadmon", he: "קדמון", gloss: "lit. preceding; the third level, where the shiur of a particular is made", segment: 11 }
- { term: "tehiru ila'a", he: "טהירו עילאה", gloss: "the upper purity; everything before the tzimtzum", segment: 20 }
- { term: "glif glifu", he: "גליף גליפו", gloss: "He engraved an engraving; the engraving of letters, which has a level in each of Yachid, Echad and Kadmon", segment: 27 }
- { term: "Ana Emloch", he: "אנא אמלוך", gloss: "I shall rule; the will for kingship that arose in the simple will", segment: 31 }
- { term: "shiur", he: "שיעור", gloss: "estimation; the measuring of what will be, in Kadmon", segment: 32 }
- { term: "yechida", he: "יחידה", gloss: "the essence of the soul", segment: 34 }
- { term: "chafetz chesed", he: "חפץ חסד", gloss: "the desire for kindness", segment: 35 }
- { term: "hiyuli", he: "היולי", gloss: "raw potential; a power that holds every particular that may come out of it", segment: 37 }
