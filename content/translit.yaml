# Transliteration table for the study guide (spec §2.3).
#
# Terms appear in the class transcripts in Hebrew script. In the guide they are
# written as *italic transliterations* in Chabad/Ashkenazi colloquial spelling,
# using the `term` below. `gloss` is a short meaning a chapter may give at a
# term's first use (in parentheses); it is a plain or literal meaning, not an
# explanation of the concept.
#
# Read-only for the chapter writers. A term missing here goes in that chapter's
# _terms.yaml, spelled consistently; the spellings are reconciled across
# chapters afterwards. Several Hebrew spellings may share one `term`.
#
# Proper names (sefiros, worlds, partzufim, people, books) are capitalised;
# common nouns are lower case.

