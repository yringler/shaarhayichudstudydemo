# Builds the site and the print-ready KDP PDF (7 x 10 in, no bleed), puts the
# PDF in the site root, and deploys to Cloudflare Pages. The PDF is also kept
# as a workflow artifact.
#
# Replaces Cloudflare's Git-connected build (its build image has no Chromium):
# turn off automatic deployments for the Pages project, and add these repository
# secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      view:
        description: 'Content view of the PDF'
        type: choice
        options: [guide, explanation, text]
        default: guide
      final:
        description: 'Final: remove the draft notices (only once every section is reviewed)'
        type: boolean
        default: false
      deploy:
        description: 'Deploy to Cloudflare Pages (main: production; other branches: a preview)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright, and poppler for the PDF checks
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      # npm run pdf runs npm run build first (content validation, then astro build into dist/).
      - name: Build the site and the PDF
        env:
          VIEW: ${{ inputs.view || 'guide' }}
          FINAL: ${{ inputs.final && '--final' || '' }}
        run: npm run pdf -- --view "$VIEW" $FINAL

      - name: Put the PDF in the site
        run: cp pdf/shaar-hayichud-booklet-1-7x10.pdf dist/

      - uses: actions/upload-artifact@v4
        with:
          name: shaar-hayichud-booklet-1-7x10-${{ inputs.view || 'guide' }}${{ inputs.final && '-final' || '' }}
          path: pdf/*.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || inputs.deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shaarhayichudstudydemo --branch=${{ github.ref_name }} --commit-dirty=true
