# Builds the print-ready KDP PDF (7 x 10 in, no bleed) and uploads it as a
# workflow artifact. Run it by hand from the Actions tab ("Run workflow"), or it
# runs on every push to main that touches the guide.
name: Book PDF

on:
  workflow_dispatch:
    inputs:
      view:
        description: 'Content view'
        type: choice
        options: [guide, explanation, text]
        default: guide
      final:
        description: 'Final: remove the draft notices (only once every section is reviewed)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pdf.yml'

permissions:
  contents: read

concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright, and poppler for the PDF checks
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build the PDF
        env:
          VIEW: ${{ inputs.view || 'guide' }}
          FINAL: ${{ inputs.final && '--final' || '' }}
        run: npm run pdf -- --view "$VIEW" $FINAL

      - uses: actions/upload-artifact@v4
        with:
          name: shaar-hayichud-booklet-1-7x10-${{ inputs.view || 'guide' }}${{ inputs.final && '-final' || '' }}
          path: pdf/*.pdf
          if-no-files-found: error
          retention-days: 30
